<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅览围读 · Hermes</title>
<style>
  :root { --bg:#f7f6f3; --card:#fff; --fg:#2b2b2b; --muted:#8a8a86; --accent:#3a7d6d; --border:#e5e3dd; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  /* 书架 */
  #shelf { max-width:1080px; margin:0 auto; padding:24px 16px 60px; }
  #shelf h1 { font-size:20px; font-weight:600; margin:4px 0 2px; }
  #shelf .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  #search { width:100%; max-width:420px; padding:8px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:var(--card); outline:none; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin-top:20px; }
  .bk { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; cursor:pointer; transition:box-shadow .15s; overflow:hidden; }
  .bk:hover { box-shadow:0 4px 14px rgba(0,0,0,.10); }
  .bk .cv { height:150px; border-radius:6px; background:#e8e6e0; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:8px; }
  .bk .cv img { width:100%; height:100%; object-fit:cover; }
  .bk .cv .ph { color:#a09c94; font-size:26px; font-weight:700; }
  .bk .tt { font-size:13px; font-weight:600; line-height:1.35; max-height:2.7em; overflow:hidden; }
  .bk .au { font-size:11px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bk .fm { display:inline-block; font-size:10px; margin-top:5px; padding:1px 7px; border-radius:9px; background:var(--accent); color:#fff; text-transform:uppercase; }
  /* 阅读器 —— codex 淡雅白主题 */
  #reader { display:none; position:fixed; inset:0; background:#f6f5f2; flex-direction:column; }
  #bar { display:flex; gap:10px; align-items:center; padding:8px 14px; background:#fdfcf9; color:#3d3d3a; font-size:13px; border-bottom:1px solid #e8e6e0; }
  #bar button { background:#fff; color:#3d3d3a; border:1px solid #e2e0da; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:13px; }
  #bar button:hover { border-color:#b8b5ad; background:#f6f5f2; }
  #bar button.on { background:#1c1c1a; color:#fff; border-color:#1c1c1a; }
  #bar .tt { flex:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#1c1c1a; }
  #bar .pg { color:#8a8a86; min-width:80px; text-align:right; }
  #stage { flex:1; overflow:hidden; display:flex; justify-content:center; background:#f6f5f2; }
  #stage foliate-view { width:100%; max-width:860px; height:100%; margin:0 auto; }
  #stage foliate-view.spread { max-width:1400px; }
  #stage iframe.pdfview { width:100%; height:100%; border:none; background:#fff; }
  #stage .txtview { position:relative; width:100%; max-width:760px; height:100%; margin:0 auto; overflow-y:auto; padding:32px 36px 80px; box-sizing:border-box; background:var(--card,#fff); color:var(--fg,#333); }
  #stage .txtview h2 { font-size:17px; margin:28px 0 14px; color:var(--accent,#1a73e8); border-bottom:1px solid var(--border,#eee); padding-bottom:6px; }
  #stage .txtview h2:first-child { margin-top:0; }
  #stage .txtview p { font-size:16px; line-height:1.9; margin:0 0 12px; text-indent:2em; }
  #toc { position:fixed; left:0; top:42px; bottom:0; width:280px; background:#fdfcf9; color:#3d3d3a; overflow:auto; padding:12px; font-size:13px; display:none; border-right:1px solid #e8e6e0; z-index:10; }
  #toc a { display:block; padding:5px 8px; border-radius:5px; color:#3d3d3a; text-decoration:none; cursor:pointer; }
  #toc a:hover { background:#f0eee9; }
  #err { position:fixed; inset:41px 0 0; display:none; align-items:center; justify-content:center; color:#f66; font-size:14px; padding:30px; text-align:center; }
  /* 管理模式 */
  #toolbar { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
#pager { display:flex; align-items:center; gap:10px; margin-top:16px; justify-content:center; font-size:13px; color:var(--muted-foreground,#888); }
#pager button { cursor:pointer; border:1px solid var(--border); background:var(--card); border-radius:6px; padding:3px 10px; }
#pager button:disabled { opacity:.4; cursor:default; }
#grid .bk { position:relative; }
/* 管理模式选择框：默认隐藏，body.manage 显示 */
.bk .selbox { display:none; position:absolute; top:6px; right:6px; z-index:3; background:#fff; border:1px solid var(--border); border-radius:6px; padding:3px; cursor:pointer; }
body.manage .bk .selbox { display:block; }
body.manage .bk .selbox input { width:16px; height:16px; cursor:pointer; }
body.manage .bk { outline:1px dashed var(--border); }
#mgrBar { display:none; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; padding:10px 12px; background:var(--card); border:1px solid var(--border); border-radius:10px; position:sticky; top:8px; z-index:20; }
#mgrBar button { cursor:pointer; border:1px solid var(--border); background:var(--background,transparent); border-radius:6px; padding:5px 10px; }
#mgrBar b { color:#e8590c; }
.nb { position:absolute; top:6px; left:6px; background:#e8590c; color:#fff; font-size:11px; line-height:1; padding:3px 7px; border-radius:8px; z-index:2; }
.bk.addcard { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:210px; border-style:dashed; color:var(--muted-foreground,#888); }
.bk.addcard .big { font-size:30px; }
.bk.addcard .btns { display:flex; flex-direction:column; gap:6px; }
.bk.addcard button { cursor:pointer; border:1px solid var(--border); background:var(--card); border-radius:6px; padding:5px 12px; font-size:13px; }
#addModal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:99; }
#addModal .box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; max-width:380px; font-size:14px; line-height:1.7; }
#addModal .box button { cursor:pointer; border:1px solid var(--border); background:var(--card); border-radius:6px; padding:6px 14px; margin-right:8px; }
  #toolbar button { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; color:var(--fg); }
  #toolbar button:hover { border-color:var(--accent); color:var(--accent); }
  #toolbar button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .bk { position:relative; }
  .bk .acts { display:none; position:absolute; top:6px; right:6px; gap:4px; }
  body.manage .bk .acts { display:flex; }
  body.manage .bk { cursor:default; }
  .bk .acts button { border:none; border-radius:6px; padding:3px 8px; font-size:11px; cursor:pointer; background:rgba(255,255,255,.92); box-shadow:0 1px 4px rgba(0,0,0,.18); }
  .bk .acts .del { color:#c0392b; }
  .bk .acts .cvbtn { color:var(--accent); }
  .bk .acts .mv { color:#7a5ea8; }
  #bkSubtabs { display:flex; gap:4px; margin:6px 0 2px; }
  #bkSubtabs button { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:5px 14px; font-size:12px; cursor:pointer; color:var(--muted); }
  #bkSubtabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal .box { background:var(--card); border-radius:12px; padding:20px; max-width:720px; width:92%; max-height:80vh; overflow:auto; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .modal .close { float:right; border:none; background:none; font-size:18px; cursor:pointer; color:var(--muted); }
  #cands { display:flex; gap:12px; flex-wrap:wrap; }
  .cand { width:130px; text-align:center; cursor:pointer; border:1px solid var(--border); border-radius:8px; padding:8px; font-size:11px; }
  .cand:hover { border-color:var(--accent); box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .cand img { width:100%; height:170px; object-fit:contain; background:#eee; border-radius:4px; }
  #trashList .ti { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  #trashList .ti button { border:none; background:var(--accent); color:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  #trashList .ti .meta { color:var(--muted); font-size:11px; }
  /* ---- 今日 / 回顾 / 听书 ---- */
  .card { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin:10px 0; background:var(--card); }
  .card h4 { margin:0 0 8px; font-size:13px; color:var(--muted); }
  .card .big { font-size:26px; font-weight:700; }
  .card .row { display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed var(--border); }
  .card .row:last-child { border-bottom:none; }
  .quote { font-size:14px; line-height:1.8; padding:10px 12px; border-left:3px solid var(--accent); background:var(--card); border-radius:8px; margin:8px 0; }
  .quote .src { color:var(--muted); font-size:12px; margin-top:6px; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; max-width:420px; }
  .cal .d { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:11px; border-radius:6px; background:var(--card); border:1px solid var(--border); cursor:pointer; }
  .cal .d.has { background:var(--accent); color:#fff; border-color:var(--accent); }
  .cal .d.sel { outline:2px solid var(--accent); }
  .cal .d.mute { opacity:.35; cursor:default; }
  .cal .hd { font-size:10px; color:var(--muted); cursor:default; border:none; background:none; }
  .pods { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
  .pod { flex:1; min-width:220px; border:1px solid var(--border); border-radius:10px; padding:12px 14px; text-decoration:none; color:inherit; background:var(--card); }
  .pod b { display:block; margin-bottom:4px; }
  .pod span { font-size:12px; color:var(--muted); }
  .lsbk { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .lsbk button { white-space:nowrap; }
  #ttsBtn.on { color:var(--accent); border-bottom-color:var(--accent); }

  /* 顶部板块 tab */
  #tabs { display:flex; gap:6px; margin:14px 0 4px; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  #tabs::-webkit-scrollbar { display:none; }
  #tabs button { background:none; border:none; padding:9px 16px; font-size:14px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; font-weight:600; }
  #tabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .view { display:none; }
  .view.on { display:block; }
  /* 微信读书 */
  .wrmsg { padding:24px 0; color:var(--muted); font-size:13px; line-height:1.7; }
  .wrmsg input { display:block; margin-top:8px; padding:7px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; width:320px; max-width:90%; }
  .wrmsg button { margin-top:10px; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 16px; cursor:pointer; font-size:13px; }
  .wrgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:14px; margin-top:16px; }
  .wr { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px; }
  .wr .cv { height:140px; border-radius:6px; background:#eceae5; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#a09c94; }
  .wr .cv img { width:100%; height:100%; object-fit:cover; }
  .wr .tt { font-size:12px; font-weight:600; line-height:1.3; margin-top:6px; max-height:2.6em; overflow:hidden; }
  .wr .au { font-size:10px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wr .pr { height:4px; background:#eee; border-radius:2px; margin-top:6px; }
  .wr .pr i { display:block; height:100%; background:var(--accent); border-radius:2px; }
  .wr .pp { font-size:10px; color:var(--accent); margin-top:2px; text-align:right; }
  /* 阅读报告 */
  #reportView h2 { font-size:15px; margin:18px 0 8px; }
  .rcards { display:flex; gap:12px; flex-wrap:wrap; }
  .rcard { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 18px; min-width:130px; }
  .rcard .n { font-size:22px; font-weight:700; color:var(--accent); }
  .rcard .l { font-size:11px; color:var(--muted); margin-top:3px; }
  .rbar { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px; }
  .rbar .nm { width:170px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rbar .bar { flex:1; height:10px; background:#efede8; border-radius:5px; overflow:hidden; }
  .rbar .bar i { display:block; height:100%; background:var(--accent); }
  /* 微信读书子 tab + 书墙 + 笔记弹窗 */
  .subtabs { display:flex; gap:4px; margin-top:10px; }
  .subtabs button { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 14px; font-size:12px; cursor:pointer; color:var(--muted); }
  .subtabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .wallmonth { margin-top:16px; }
  .wallmonth h3 { font-size:13px; color:var(--accent); margin:10px 0 6px; }
  .wallgrid { display:flex; flex-wrap:wrap; gap:6px; }
  .wallgrid img { width:52px; height:72px; object-fit:cover; border-radius:4px; background:#eceae5; }
  .wr .cv { cursor:pointer; }
  #noteList .ni { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin:8px 0; font-size:13px; line-height:1.6; }
  #noteList .ni .ch { font-size:11px; color:var(--muted); margin-bottom:4px; }
  #noteList .ni .ai { margin-top:8px; padding:10px; background:#f4f2ec; border-radius:6px; font-size:12px; white-space:pre-wrap; }
  .mini { background:none; border:1px solid var(--accent); color:var(--accent); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; margin-top:6px; }
  /* 本地跟踪 */
  .lsec { margin-top:16px; padding-top:12px; border-top:1px solid var(--border); }
  .hmgrid { display:flex; flex-wrap:wrap; gap:3px; max-width:640px; }
  .hmcell { width:14px; height:14px; border-radius:3px; background:#efede8; }
  .hmlegend { font-size:11px; color:var(--muted); margin-top:6px; }

</style>
</head>
<body>
<div id="shelf">
  <h1>阅览围读 · Hermes 版</h1>
  <div class="sub" id="count">加载书库…</div>
  <div class="subtabs" id="bkSubtabs">
    <button data-sub="main" class="on">📖 书库</button>
    <button data-sub="misc">🧺 杂书架</button>
    <button data-sub="adult">🔞 18+</button>
  </div>
  <div id="tabs">
    <button data-tab="local" class="on">📚 本地书库</button>
    <button data-tab="weread">📕 微信读书</button>
    <button data-tab="report">📈 阅读报告</button>
    <button data-tab="today">☀ 今日</button>
    <button data-tab="review">🗓 回顾</button>
    <button data-tab="listen">🎧 听书</button>
    <button data-tab="ext" id="extBtn" title="用系统默认浏览器打开书库（可全屏阅读）">🌐 外部阅读</button>
  </div>
  <div class="view on" id="localView">
  <input id="search" placeholder="搜书名 / 作者，回车清空">
  <div id="toolbar">
    <button id="manageBtn">📋 管理 / 批量转移</button>
    <button id="rescanBtn">↻ 重新扫描书库</button>
    <button id="trashBtn">♻ 回收站</button>
    <button id="coverAllBtn">🖼 无封面批量匹配</button>
    <button id="renameBtn">📝 拼音改名（元数据书名）</button>
  </div>
  <div id="grid"></div>
  <div id="pager"></div>
  </div>
  <div class="view" id="wereadView">
    <div class="subtabs" id="wrSubtabs">
      <button data-sub="shelf" class="on">书架</button>
      <button data-sub="notes">笔记回顾</button>
      <button data-sub="wall">年度书墙</button>
    </div>
    <div id="wrBody" class="wrmsg">加载微信读书书架…</div>
    <div class="wrgrid" id="wrGrid"></div>
    <div id="wrExtra"></div>
  </div>
  <div class="view" id="reportView">
    <div id="rpBody" class="wrmsg">加载阅读统计…</div>
    <div id="rpContent"></div>
  </div>
  <div class="view" id="todayView">
    <div id="tdBody" class="wrmsg">加载今日数据…</div>
    <div id="tdContent"></div>
  </div>
  <div class="view" id="reviewView">
    <div id="rvBody" class="wrmsg">加载笔记索引…</div>
    <div id="rvContent"></div>
  </div>
  <div class="view" id="listenView">
    <div id="lsBody" class="wrmsg">加载听书…</div>
    <div id="lsContent"></div>
  </div>
</div>

<div class="modal" id="noteModal"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <b id="noteTitle"></b><button onclick="closeModal('noteModal')">✕ 关闭</button>
  </div>
  <div id="noteList"></div>
</div></div>

<div class="modal" id="coverModal"><div class="box">
  <button class="close" onclick="closeCoverModal()">✕</button>
  <h3 id="coverTitle">选择封面</h3>
  <div id="coverMsg" style="color:var(--muted);font-size:12px;margin-bottom:10px;"></div>
  <div id="cands"></div>
</div></div>

<div class="modal" id="trashModal"><div class="box">
  <button class="close" onclick="document.getElementById('trashModal').style.display='none'">✕</button>
  <h3>♻ 回收站（可恢复）</h3>
  <div id="trashList"></div>
</div></div>

<div id="reader">
  <div id="bar">
    <button id="back">← 书架</button>
    <button id="tocbtn">目录</button>
    <div class="tt" id="rtitle"></div>
    <button id="spreadBtn" title="切换单页 / 双页">▤ 双页</button>
    <button id="ttsBtn" title="朗读本章（TTS）">▶ 朗读</button>
    <button id="prev">‹</button>
    <button id="next">›</button>
    <div class="pg" id="pg"></div>
  </div>
  <div id="stage"></div>
  <div id="toc"></div>
  <div id="err"></div>
</div>

<script type="module">
import { View, makeBook } from '/foliate/view.js';

const $ = s => document.querySelector(s);
let books = [];
let bkShelf = localStorage.getItem('qmu-bksub') || 'main';
document.querySelectorAll('#bkSubtabs button').forEach(btn => {
  btn.onclick = () => loadShelf(btn.dataset.sub);
});
async function moveShelf(b, target) {
  const r = await fetch('/api/shelf', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: b.id, shelf: target }) });
  const d = await r.json();
  if (!d.ok) return showErr('移动失败：' + (d.error || '?'));
  loadShelf();
}
let view = null;

function showErr(msg) { const e = $('#err'); e.style.display = 'flex'; e.textContent = msg; }

async function loadShelf(shelf) {
  bkShelf = shelf || bkShelf || localStorage.getItem('qmu-bksub') || 'main';
  localStorage.setItem('qmu-bksub', bkShelf);
  document.querySelectorAll('#bkSubtabs button').forEach(b => b.classList.toggle('on', b.dataset.sub === bkShelf));
  const r = await fetch('/api/books?shelf=' + bkShelf);
  const d = await r.json();
  books = d.books;
  const names = { main: '书库', misc: '杂书架', adult: '18+' };
  $('#count').textContent = `${names[bkShelf]} ${d.count} 本 / 全库 ${d.total} 本 · 书库 F:\\Users\\Calibre 书库（删入回收站可恢复）`;
  curPage = 1;
  renderGrid(books);
}

/* ---- 书架分页：固定每页 3 行，列数随屏宽自适应（沿用原小卡片风格），可切回连续滚动 ---- */
const PAGE_ROWS = 3;
let pageMode = localStorage.getItem('qmu-pagemode') || 'page';
let curPage = 1;
let viewList = [];

function pageSize() {
  // 按 #grid 实际宽度算列数（列宽 120 + 间距 14），页大小 = 列数 × 3 行
  const g = $('#grid');
  const cols = Math.max(1, Math.floor((g.clientWidth + 14) / (120 + 14)));
  return cols * PAGE_ROWS;
}

function totalPages() { return Math.max(1, Math.ceil(viewList.length / pageSize())); }

function gotoPage(n) {
  curPage = Math.min(Math.max(1, n), totalPages());
  renderGrid(viewList);
  const g = $('#grid');
  if (g) window.scrollTo({ top: g.offsetTop - 60, behavior: 'smooth' });
}

function togglePageMode() {
  pageMode = pageMode === 'page' ? 'scroll' : 'page';
  localStorage.setItem('qmu-pagemode', pageMode);
  renderGrid(viewList);
}

function renderGrid(list) {
  viewList = list;
  const grid = $('#grid');
  grid.innerHTML = '';
  let rows = list;
  if (pageMode === 'page') {
    const start = (curPage - 1) * pageSize();
    rows = list.slice(start, start + pageSize());
  }
  for (const b of rows) {
    const el = document.createElement('div');
    el.className = 'bk';
    el.innerHTML = `<div class="cv">${b.cover ? `<img loading="lazy" src="/cover/${b.id}">` : `<div class="ph">${(b.title[0] || '书')}</div>`}${b.opened ? '' : '<span class="nb">新增</span>'}<label class="selbox" title="选择"><input type="checkbox" data-selpath="${esc(b.path)}" ${mgrSel.has((b.path||'').toLowerCase()) ? 'checked' : ''}></label></div>
      <div class="tt">${esc(b.title)}</div>
      <div class="au">${esc(b.author || '')}</div>
      <span class="fm">${b.format}</span>
      <div class="acts">
        ${['main','misc','adult'].filter(s => s !== b.shelf).map(s =>
          `<button class="mv" data-act="shelf:${s}">${{main:'📚', misc:'🧺', adult:'🔞'}[s]}</button>`).join('')}
        ${b.cover ? `<button class="cvbtn" data-act="cover">🖼 换封面</button>` : `<button class="cvbtn" data-act="cover">🖼 封面</button>`}
        <button class="del" data-act="del">✕ 删</button>
      </div>`;
    el.onclick = (ev) => {
      if (ev.target?.closest?.('.selbox')) {
        const cb = ev.target.closest('.selbox').querySelector('input');
        const p = (cb.dataset.selpath || '').toLowerCase();
        cb.checked ? mgrSel.add(p) : mgrSel.delete(p);
        mgrUpdate();
        return; // 管理模式勾选不触发打开书
      }
      const act = ev.target?.dataset?.act;
      if (act === 'cover') return pickCover(b);
      if (act === 'del') return delBook(b);
      if (act?.startsWith('shelf:')) return moveShelf(b, act.slice(6));
      openBook(b);
    };
    grid.appendChild(el);
  }
  // 每页末尾的「添加书籍」口子
  const add = document.createElement('div');
  add.className = 'bk addcard';
  add.innerHTML = `<div class="big">➕</div><div>添加书籍</div>
    <div class="btns">
      <button data-add="lib">📂 打开书库文件夹</button>
      <button data-add="scan">↻ 重新扫描</button>
    </div>`;
  add.onclick = (ev) => {
    const a = ev.target?.dataset?.add;
    if (a === 'lib') return showLibAdd();
    if (a === 'scan') return $('#rescanBtn').click();
  };
  grid.appendChild(add);

  // 分页条（连续滚动模式下只留切换按钮）
  const pager = $('#pager');
  if (pageMode === 'page') {
    const tp = totalPages();
    pager.innerHTML = `<button id="pgPrev" ${curPage <= 1 ? 'disabled' : ''}>‹ 上一页</button>
      <span>第 ${curPage} / ${tp} 页 · 共 ${list.length} 本</span>
      <button id="pgNext" ${curPage >= tp ? 'disabled' : ''}>下一页 ›</button>
      <button id="pgMode">📜 连续滚动</button>`;
    $('#pgPrev').onclick = () => gotoPage(curPage - 1);
    $('#pgNext').onclick = () => gotoPage(curPage + 1);
    $('#pgMode').onclick = togglePageMode;
  } else {
    pager.innerHTML = `<button id="pgMode">📄 分页浏览</button><span>共 ${list.length} 本</span>`;
    $('#pgMode').onclick = togglePageMode;
  }
}
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function openNotes(b) {
  $('#noteTitle').textContent = b.title + '（✍' + b.noteCount + ' 💭' + b.reviewCount + '）';
  $('#noteList').innerHTML = '<div class="wrmsg">加载划线笔记…</div>';
  $('#noteModal').style.display = 'flex';
  try {
    const r = await fetch('/api/weread/notes/' + b.bookId);
    const d = await r.json();
    if (!d.ok) { $('#noteList').innerHTML = '<div class="wrmsg">' + esc(d.error || '加载失败') + '</div>'; return; }
    $('#noteList').innerHTML = d.items.length ? '' : '<div class="wrmsg">这本书还没有划线笔记。</div>';
    d.items.forEach((n, i) => {
      const el = document.createElement('div');
      el.className = 'ni';
      el.innerHTML = `<div class="ch">${n.type === 'review' ? '💭 想法' : '✍ 划线'} · ${esc(n.chapter)} · ${n.time ? new Date(n.time * 1000).toLocaleDateString() : ''}</div>
        <div>${esc(n.text)}</div>
        ${i === 0 ? `<button class="mini" id="aiBtn">🤖 AI 总结这本书</button>
          <button class="mini" id="aiThemeBtn" style="margin-left:6px">🧭 划线主题分析（流式）</button>
          <div class="ai" id="aiBox" style="display:none"></div>` : ''}`;
      $('#noteList').appendChild(el);
    });
    const btn = document.getElementById('aiBtn');
    if (btn) btn.onclick = async () => {
      btn.disabled = true; btn.textContent = '🤖 总结中…（约 30 秒）';
      const box = document.getElementById('aiBox');
      box.style.display = 'block';
      try {
        const r2 = await fetch('/api/ai/summary', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: b.bookId, title: b.title, highlights: d.items }) });
        const d2 = await r2.json();
        box.textContent = d2.ok ? d2.summary : (d2.error || 'AI 调用失败');
      } catch (e) { box.textContent = 'AI 调用失败：' + e; }
      btn.style.display = 'none';
    };
    const themeBtn = document.getElementById('aiThemeBtn');
    if (themeBtn) themeBtn.onclick = async () => {
      themeBtn.disabled = true; themeBtn.textContent = '🧭 分析中…';
      const box = document.getElementById('aiBox');
      box.style.display = 'block'; box.textContent = '';
      const hl = d.items.filter(n => n.text).slice(0, 60).map(n => '- ' + n.text).join('\n');
      try {
        const out = await aiStream([{ role: 'user', content:
          `以下是我在微信读书读《${b.title}》的划线与想法：\n${hl}\n\n请流式输出中文分析：1) 3-5 个反复出现的主题；2) 每个主题配一条原文划线佐证；3) 一句总评。` }], box);
        if (!out) box.textContent = '（AI 未返回内容）';
      } catch (e) { box.textContent = 'AI 调用失败：' + e.message; }
      themeBtn.style.display = 'none';
    };
  } catch (e) { $('#noteList').innerHTML = '<div class="wrmsg">加载失败：' + esc(String(e)) + '</div>'; }
}

async function loadWrWall(year) {

function fmtMin(sec) { return sec >= 3600 ? (sec/3600).toFixed(1) + ' 小时' : Math.round(sec/60) + ' 分钟'; }

async function loadReport() {
  try {
    const r = await fetch('/api/weread/stats?mode=overall');
    const d = await r.json();
    if (!d.ok) { rpMsg('阅读统计加载失败：' + esc(d.error || '?')); return; }
    const s = d.stats || {};
    const rc = (n, l) => `<div class="rcard"><div class="n">${n}</div><div class="l">${l}</div></div>`;
    const bars = (list, nmf, vf) => {
      const max = Math.max(...list.map(vf), 1);
      return list.map(v => `<div class="rbar"><div class="nm">${esc(nmf(v))}</div>
        <div class="bar"><i style="width:${(vf(v)/max*100).toFixed(0)}%"></i></div>
        <div class="v">${fmtMin(vf(v))}</div></div>`).join('');
    };
    let html = `<h2>今日</h2><div class="rcards" id="todayCards"></div>
      <h2>累计阅读</h2><div class="rcards">
      ${rc(fmtMin(s.totalReadTime || 0), '微信读书 · 总时长')}
      ${rc(s.readDays || 0, '微信读书 · 天数')}
      ${rc(Math.max(0, Math.round((s.totalReadTime || 0) / Math.max(s.readDays || 1, 1) / 60)) + ' 分钟', '日均时长')}
      ${rc((new Date((s.registTime || 0) * 1000)).getFullYear(), '注册年份')}</div>`;
    // 今日卡片：微信读书 + 本地
    try {
      const [tr, lr] = await Promise.all([
        fetch('/api/weread/today').then(r => r.json()).catch(() => null),
        fetch('/api/track').then(r => r.json()).catch(() => null),
      ]);
      let tc = '';
      if (tr && tr.ok) tc += rc(fmtMin(tr.todaySec || 0), '今日 · 微信读书');
      if (lr && lr.ok) tc += rc(fmtMin(lr.todaySec || 0), '今日 · 本地书库');
      if (lr && lr.ok) tc += rc(lr.bookCount || 0, '本地 · 已读书目');
      if (lr && lr.ok) tc += rc(lr.dayCount || 0, '本地 · 记录天数');
      const tel = document.getElementById('todayCards');
      if (tel) tel.innerHTML = tc || rc('0', '今日尚未阅读');
    } catch (e) {}
    // 微信年度热力图
    const hmYear = (new Date()).getFullYear();
    try {
      const hr = await fetch('/api/weread/heatmap/' + hmYear);
      const hd = await hr.json();
      if (hd.ok) {
        const daily = hd.daily || {};
        const max = Math.max(...Object.values(daily), 1);
        const start = new Date(hmYear, 0, 1);
        let cells = '';
        for (let d2 = new Date(start); d2.getFullYear() === hmYear; d2.setDate(d2.getDate() + 1)) {
          const key = String(Math.floor(new Date(d2.getFullYear(), d2.getMonth(), d2.getDate()).getTime() / 1000));
          const v = daily[key] || 0;
          const lv = v === 0 ? 0 : Math.min(4, Math.ceil(v / max * 4));
          const c = ['#efede8', '#cfe3cf', '#a5d0a5', '#6fb96f', '#3d9b3d'][lv];
          cells += `<div class="hmcell" style="background:${c}" title="${d2.toISOString().slice(0, 10)} ${fmtMin(v)}"></div>`;
        }
        html += `<h2>微信读书 ${hmYear} 年度热力图</h2><div class="hmgrid">${cells}</div>
          <div class="hmlegend">越绿读得越多 · 数据来自微信读书 API（近几个月 API 窗口限制，可能不完整）</div>`;
      }
    } catch (e) {}
    const rs = s.readStat || [];
    if (rs.length) html += `<div class="rcards" style="margin-top:10px;">` +
      rs.map(x => rc(x.counts, x.stat)).join('') + `</div>`;
    const longest = (s.readLongest || []).filter(x => x.book && x.book.title).slice(0, 8);
    if (longest.length) html += `<h2>读得最多的书</h2>` + bars(longest, v => v.book.title, v => v.readTime);
    const cats = (s.preferCategory || []).slice(0, 8);
    if (cats.length) html += `<h2>偏好分类</h2>` + bars(cats, v => (v.parentCategoryTitle ? v.parentCategoryTitle + ' · ' : '') + v.categoryTitle, v => v.readingTime);
    const times = s.preferTime || [];
    if (times.length === 24) {
      const max = Math.max(...times, 1);
      html += `<h2>24 小时阅读时段（微信读书）</h2><div style="display:flex;gap:3px;align-items:flex-end;height:90px;max-width:560px;">` +
        times.map((v, h) => `<div style="flex:1;text-align:center;"><div style="height:${(v/max*80).toFixed(0)}px;background:var(--accent);border-radius:2px 2px 0 0;"></div><div style="font-size:9px;color:var(--muted);">${h}</div></div>`).join('') + `</div>`;
    }
    // 本地书库跟踪
    try {
      const lr = await fetch('/api/track').then(r => r.json());
      if (lr.ok) {
        let lh = `<div class="lsec"><h2>本地书库阅读跟踪</h2><div class="rcards">
          ${rc(fmtMin(lr.totalSec || 0), '本地 · 总时长')}
          ${rc(lr.dayCount || 0, '本地 · 记录天数')}
          ${rc(lr.bookCount || 0, '本地 · 书目数')}</div>`;
        const tops = (lr.topBooks || []).filter(b => b.seconds > 0);
        if (tops.length) {
          const max = Math.max(...tops.map(b => b.seconds), 1);
          lh += tops.map(b => `<div class="rbar"><div class="nm">${esc(b.title)}</div>
            <div class="bar"><i style="width:${(b.seconds/max*100).toFixed(0)}%"></i></div>
            <div class="v">${fmtMin(b.seconds)} · ${b.lastPercent}%</div></div>`).join('');
        } else {
          lh += `<div class="wrmsg">打开任意本地书籍阅读 15 秒后，这里会出现记录。</div>`;
        }
        // 本地每日热力
        const days = lr.days || {};
        if (Object.keys(days).length) {
          const max = Math.max(...Object.values(days), 1);
          lh += `<h2>本地每日时长</h2><div style="display:flex;gap:3px;align-items:flex-end;height:70px;max-width:560px;">` +
            Object.entries(days).map(([d, v]) => `<div style="flex:1;text-align:center;" title="${d} ${fmtMin(v)}"><div style="height:${(v/max*60).toFixed(0)}px;background:var(--accent);border-radius:2px 2px 0 0;"></div><div style="font-size:9px;color:var(--muted);">${d.slice(5)}</div></div>`).join('') + `</div>`;
        }
        lh += `</div>`;
        html += lh;
      }
    } catch (e) {}
    $('#rpBody').style.display = 'none';
    $('#rpContent').innerHTML = html;
  } catch (e) { rpMsg('阅读统计加载失败：' + esc(String(e))); }
}

/* ---- 本地阅读跟踪：阅读器打开时每 15 秒上报一次 ---- */
let trackTimer = null, trackSeconds = 0, trackMeta = null;
function startTracking(book) {
  stopTracking();
  trackMeta = book;
  trackSeconds = 0;
  trackTimer = setInterval(() => {
    trackSeconds += 15;
    fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookId: 'local-' + book.id, title: book.title,
        delta: 15, percent: Math.round((book.lastProgress || 0) * 100) }) }).catch(() => {});
  }, 15000);
}
function stopTracking() {

let mgrSel = new Set(); // 选中书的 path
function mgrUpdate() {
  let bar = document.getElementById('mgrBar');
  if (!bar) {
    bar = document.createElement('div'); bar.id = 'mgrBar';
    document.getElementById('toolbar').after(bar);
  }
  const n = mgrSel.size;
  if (!document.body.classList.contains('manage')) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = n
    ? `<b>已选 ${n} 本</b>
    <button data-b="all">☑ 全选本页</button>
    <button data-b="main">📚 移入书库</button>
    <button data-b="misc">🧺 移入杂书架</button>
    <button data-b="adult">🔞 移入18+</button>
    <button data-b="del">♻ 删除（回收站）</button>
    <button data-b="clear">清除选择</button>`
    : `<b>未选择</b>
    <button data-b="all">☑ 全选本页</button>
    <button data-b="clear">清除选择</button>`;
  bar.querySelectorAll('button').forEach(btn => btn.onclick = () => mgrAct(btn.dataset.b));
}
async function mgrAct(act) {
  if (act === 'clear') { mgrSel.clear(); mgrUpdate(); renderGrid(viewList); return; }
  if (act === 'all') {
    // 全选当前页（分页模式取当前页，滚动模式取当前渲染列表）
    let rows = viewList;
    if (pageMode === 'page') {
      const start = (curPage - 1) * pageSize();
      rows = viewList.slice(start, start + pageSize());
    }
    rows.forEach(b => { if (b.path) mgrSel.add(b.path.toLowerCase()); });
    mgrUpdate(); renderGrid(viewList);
    return;
  }
  const sel = [...mgrSel];
  if (act === 'del') {
    if (!confirm(`把选中的 ${sel.length} 本书移入回收站？\n文件移入 _trash，可随时恢复。`)) return;
    let ok = 0, fail = 0;
    for (const p of sel) {
      const b = books.find(x => (x.path || '').toLowerCase() === p.toLowerCase());
      if (!b) { fail++; continue; }
      try {
        const r = await fetch('/api/manage/delete/' + b.id, { method: 'POST',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: b.title }) });
        (await r.json()).ok ? ok++ : fail++;
      } catch { fail++; }
    }
    mgrSel.clear(); mgrUpdate(); loadShelf();
    alert(`删除完成：成功 ${ok}，失败 ${fail}（回收站可恢复）`);
    return;
  }
  const r = await fetch('/api/shelf/batch', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ paths: sel, shelf: act }) });
  const d = await r.json();
    if (!d.ok) return alert('批量移动失败：' + (d.error || '?'));
    mgrSel.clear(); mgrUpdate(); loadShelf();
    alert(`转移完成：成功 ${d.moved ?? sel.length} 本${d.skipped ? `，跳过 ${d.skipped} 本` : ''}\n文件与封面已同步迁移到目标书架。`);
  }

  $('#manageBtn').onclick = () => {
    const on = !document.body.classList.contains('manage');
    document.body.classList.toggle('manage', on);
    $('#manageBtn').classList.toggle('on', on);
    $('#manageBtn').textContent = on ? '✓ 退出管理' : '📋 管理 / 批量转移';
    mgrSel.clear();
    mgrUpdate();
    renderGrid(viewList);
    if (on) alert('管理模式：点击书封左上角勾选（可多选），顶部会出现转移按钮——移入书库 / 杂书架 / 18+ / 删除，文件会真实移动并带走封面。');
};

/* ---- AI 流式输出（SSE） ---- */
async function aiStream(messages, box) {
  const resp = await fetch('/api/ai/chat', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages }) });
  if (!resp.ok) {
    const d = await resp.json().catch(() => ({}));
    throw new Error(d.error || ('HTTP ' + resp.status));
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', out = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const p of parts) {
      const line = p.trim();
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6);
      if (data === '[DONE]') continue;
      try {
        const j = JSON.parse(data);
        const delta = (j.choices && j.choices[0].delta && j.choices[0].delta.content) || '';
        if (delta) { out += delta; box.textContent = out; }
      } catch {}
    }
  }
  return out;
}

function renderReview(selDate) {

  let y = reviewCache._y, m = reviewCache._m;
  if (selDate) { const d = new Date(selDate + 'T00:00:00'); y = d.getFullYear(); m = d.getMonth(); reviewCache._y = y; reviewCache._m = m; }

  const old = items.filter(n => n.time && new Date(n.time*1000).toISOString().slice(5,10) === md && new Date(n.time*1000).getFullYear() < now.getFullYear());
  const startDow = (new Date(y, m, 1).getDay() + 6) % 7;

      <input id="rvSearch" placeholder="搜书名 / 内容关键词" style="display:block;margin:4px 0 10px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;width:360px;max-width:95%;">

  if (selDate) {
    const dayNotes = items.filter(n => n.time && new Date(n.time*1000).toISOString().slice(0,10) === selDate);
    c.querySelector('.cal').closest('.card').insertAdjacentHTML('afterend', `<div class="card"><h4>📅 ${selDate} 的 ${dayNotes.length} 条笔记</h4>${dayNotes.length?dayNotes.map(noteItemHtml).join(''):'<div class="wrmsg">这一天没有笔记。</div>'}</div>`);

// ---------- TXT 在线阅读 ----------
let txtState = null; // { b, box, chapters: [{title, top}] }

async function openTxt(b) {
  const stage = $('#stage');
  let buf;
  try {
    const r = await fetch(`/file/${b.id}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    buf = await r.arrayBuffer();
  } catch (err) { showErr(`TXT 加载失败：${err.message}`); return; }
  // 编码识别：BOM → utf-8 严格 → gb18030 兜底
  let text;
  const head = new Uint8Array(buf.slice(0, 3));
  const dec = (label) => new TextDecoder(label).decode(buf);
  if (head[0] === 0xFF && head[1] === 0xFE) text = new TextDecoder('utf-16le').decode(buf);
  else if (head[0] === 0xFE && head[1] === 0xFF) text = new TextDecoder('utf-16be').decode(buf);
  else if (head[0] === 0xEF && head[1] === 0xBB && head[2] === 0xBF) text = dec('utf-8');
  else {
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch { try { text = new TextDecoder('gb18030').decode(buf); } catch { text = dec('utf-8'); } }
  }
  text = text.replace(/^\uFEFF/, '');
  // 章节切分：行首 第X章/节/卷/回 等标题行
  const lines = text.split(/\r?\n/);
  const RE = /^[#\s　]*(第[0-9一二三四五六七八九十百千万零两]+[章节卷部回集][^。！？\n]{0,24}|序章|楔子|尾声|后记|番外[^。！？]{0,12})[\s　。]*$/;
  const chapters = [];
  const box = document.createElement('div');
  box.className = 'txtview';
  const addHead = (title) => {
    const h = document.createElement('h2');
    h.textContent = title;
    box.appendChild(h);
    chapters.push({ title, el: h });
  };
  addHead('卷首');
  for (const line of lines) {
    const t2 = line.trim();
    if (t2 && RE.test(t2)) { addHead(t2); continue; }
    if (!t2) continue;
    const p = document.createElement('p');
    p.textContent = t2;
    box.appendChild(p);
  }
  stage.innerHTML = '';
  stage.appendChild(box);
  chapters.forEach(c => { c.top = c.el.offsetTop; }); // 挂载后采样（挂载前 offsetTop 全为 0）
  txtState = { b, box, chapters };
  $('#pg').textContent = `${chapters.length} 章 · ${fmtSize(b.size)}`;
  // 目录
  const fill = () => {
    const tb = $('#toc'); tb.innerHTML = '';
    txtState.chapters.forEach(c => {
      const a = document.createElement('a');
      a.textContent = c.title;
      a.onclick = () => { const el = [...box.querySelectorAll('h2')].find(x => x.textContent === c.title); if (el) el.scrollIntoView(); tb.style.display = 'none'; };
      tb.appendChild(a);
    });
  };
  fill();
  // 进度恢复 + 滚动进度上报
  const key = 'qmu-txtpos-' + b.id;
  const saved = parseFloat(localStorage.getItem(key));
  if (saved > 0) box.scrollTop = saved * (box.scrollHeight - box.clientHeight);
  let last = 0;
  box.addEventListener('scroll', () => {
    const max = box.scrollHeight - box.clientHeight;
    const frac = max > 0 ? box.scrollTop / max : 0;
    if (b._trackPct == null) b._trackPct = frac;
    b._trackPct = frac;
    if (trackMeta) trackMeta.lastProgress = frac;
    localStorage.setItem(key, frac);
    const now = Date.now();
    if (now - last > 800) {
      last = now;
      const below = txtState.chapters.filter(c => c.top <= box.scrollTop);
      const ch = below[below.length - 1];
      if (ch) $('#pg').textContent = `${ch.title} · ${(frac * 100).toFixed(1)}%`;
    }
  });
  applyTheme();
  startTracking({ id: b.id, title: b.title, lastProgress: b._trackPct || 0 });
}

}

function playPod(show, ep, audio) {

  if (!bar) {
    bar = document.createElement('div'); bar.id = 'podBar';

  }

  const a = bar.querySelector('#podAudio');
  // 断点续听：就绪后跳到上次位置（canplay 可能早于历史取回，需等 loadedmetadata 兜底）
  (async () => {
    try {
      const r = await fetch('/api/listen/history'); const d = await r.json();
      const rec = (d.history || {})[audio];
      if (rec && rec.pos > 15 && !(rec.dur && rec.pos / rec.dur >= 0.95)) {
        const apply = () => { if (a.currentTime < 5) { try { a.currentTime = rec.pos; } catch (e) {} } };
        if (a.readyState >= 1) apply();
        else a.addEventListener('loadedmetadata', apply, { once: true });
      }
    } catch (e) {}
    // 立即入历史（必须在读取续听位置之后，否则 pos=0 会覆盖旧进度）
    savePos(show, ep, audio, 0, 0);
    setTimeout(loadHistory, 1500);

  let lastSave = 0;
  const save = () => { savePos(show, ep, audio, a.currentTime, a.duration); lastSave = Date.now(); };
  a.addEventListener('timeupdate', () => { if (Date.now() - lastSave > 5000) save(); });
  a.addEventListener('pause', () => save());
  window.addEventListener('beforeunload', () => save());
}

let wheelLock = 0;
function onNavWheel(e) {
  if ($('#reader').style.display !== 'flex') return;
  if (e.target?.closest?.('#toc, .modal')) return;
  e.preventDefault();
  const now = Date.now();
  if (now - wheelLock < 300) return;
  if (Math.abs(e.deltaY) < 10 && Math.abs(e.deltaX) < 10) return;
  wheelLock = now;
  if (e.deltaY > 0 || e.deltaX > 0) view?.next(); else view?.prev();
}
function onNavKey(e) {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); view?.next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); view?.prev(); }
}
// 章节 iframe 文档：滚轮 + 键盘翻页（iframe 内事件不会冒泡到外层，须逐章挂）
function attachNavHandlers(doc) {
  if (!doc || doc.__qmuNav) return;
  doc.__qmuNav = true;
  doc.addEventListener('wheel', onNavWheel, { passive: false });
  doc.addEventListener('keydown', onNavKey);
}

function applyTheme() {

    attachNavHandlers(doc);

/* ---- 听书 TTS（系统 speechSynthesis，逐章连读 + 收听时长计入 track） ---- */
let ttsOn = false, ttsPaused = false, ttsListenTimer = null, ttsCurBookId = null;
function ttsChapterText() {
  const docs = view?.renderer?.getContents?.() || [];
  for (const { doc } of docs) {
    if (doc?.body) {
      const txt = (doc.body.innerText || '').replace(/\s+/g, ' ').trim();
      if (txt) return txt;
    }
  }
  return '';
}
function ttsSpeakLoop() {
  if (!ttsOn) return;
  const txt = ttsChapterText();
  if (!txt) { setTimeout(ttsSpeakLoop, 2000); return; }
  const u = new SpeechSynthesisUtterance(txt.slice(0, 4500));
  u.lang = 'zh-CN';
  u.rate = 1.0;
  u.onend = () => {
    if (!ttsOn) return;
    view?.next?.();
    setTimeout(ttsSpeakLoop, 1200);
  };
  u.onerror = () => { if (ttsOn) setTimeout(ttsSpeakLoop, 2500); };
  speechSynthesis.speak(u);
}
function ttsStart() {
  if (!('speechSynthesis' in window)) return alert('此浏览器不支持 TTS 朗读');
  ttsOn = true; ttsPaused = false;
  $('#ttsBtn').textContent = '⏸ 朗读中';
  $('#ttsBtn').classList.add('on');
  // 收听时长：每 15s 计入 track.json（书名 + 「（听）」），与阅读分开计数
  ttsCurBookId = 'listen-' + ($('#rtitle').textContent || 'x');
  clearInterval(ttsListenTimer);
  ttsListenTimer = setInterval(() => {
    if (!ttsOn) return;
    fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookId: ttsCurBookId, title: $('#rtitle').textContent + '（听）', delta: 15, percent: 0 }) });
  }, 15000);
  ttsSpeakLoop();
}
function ttsStop() {
  ttsOn = false;
  clearInterval(ttsListenTimer);
  speechSynthesis?.cancel?.();
  const b = $('#ttsBtn');
  if (b) { b.textContent = '▶ 朗读'; b.classList.remove('on'); }
}
$('#ttsBtn').onclick = () => {
  if (ttsOn) {
    if (ttsPaused) { speechSynthesis.resume(); ttsPaused = false; $('#ttsBtn').textContent = '⏸ 朗读中'; }
    else { speechSynthesis.pause(); ttsPaused = true; $('#ttsBtn').textContent = '▶ 继续朗读'; }
  } else ttsStart();
};


async function openBook(b) {
  fetch('/api/book/opened/' + b.id, { method: 'POST' }).then(() => { b.opened = true; }).catch(() => {});
  $('#shelf').style.display = 'none';
  const rd = $('#reader'); rd.style.display = 'flex';

  $('#pg').textContent = '';

  stage.innerHTML = '';

  if (b.format === 'pdf') {
    const ifr = document.createElement('iframe');
    ifr.className = 'pdfview';
    ifr.src = `/file/${b.id}`;
    stage.appendChild(ifr);
    $('#pg').textContent = fmtSize(b.size);
    return;
  }

  if (b.format === 'txt') { openTxt(b); return; }

  try {
    const resp = await fetch(`/file/${b.id}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const blob = await resp.blob();
    // foliate makeBook 需要 File.name 判断格式
    const file = new File([blob], `book.${b.format}`, { type: blob.type });
    view = new View(stage);
    stage.appendChild(view); // foliate View 必须挂进 DOM，否则 open() 挂起
    view.addEventListener('relocate', e => {
      const frac = e.detail.fraction;
      if (frac != null) $('#pg').textContent = (frac * 100).toFixed(1) + '%';
      if (b._trackPct == null) b._trackPct = frac;
      b._trackPct = frac;
      if (trackMeta) trackMeta.lastProgress = frac;
    });
    view.addEventListener('load', e => {
      // TOC
      const toc = e.detail.toc;
      const box = $('#toc');
      box.innerHTML = '';
      const walk = (items, depth) => {
        for (const it of items || []) {
          const a = document.createElement('a');
          a.textContent = '\u3000'.repeat(depth) + (it.label?.trim() || '(无标题)');
          a.onclick = () => { view.goTo(it.href); box.style.display = 'none'; };
          box.appendChild(a);
          walk(it.subitems, depth + 1);
        }
      };
      walk(toc, 0);
    });
    const book = await makeBook(file);
    await view.open(book);
    const pos = localStorage.getItem('qmu-pos-' + b.id);
    if (pos) { try { await view.goTo(pos); } catch { /* 位置失效忽略 */ } }
    applySpread();
    applyTheme();
    startTracking({ id: b.id, title: b.title, lastProgress: b._trackPct || 0 });
    view.addEventListener('relocate', () => applyTheme());
    view.addEventListener('relocate', e => {
      if (e.detail.cfi) localStorage.setItem('qmu-pos-' + b.id, e.detail.cfi);
    });
    if (window.__listenPending) {
      window.__listenPending = false;
      setTimeout(() => ttsStart(), 1800);
    }
  } catch (err) {
    stage.innerHTML = '';
    showErr(`打开失败（${b.format}）：${err.message}。该格式暂不支持在线阅读，可回 Calibre 转格式。`);
  }
}

$('#back').onclick = () => {
  stopTracking();
  ttsStop();
  try { view?.destroy?.(); } catch { /* noop */ }
  view = null;
  closeTxt();
  $('#reader').style.display = 'none';
  $('#stage').innerHTML = '';
  $('#shelf').style.display = 'block';
};
$('#next').onclick = () => { if (!txtNav(1)) view?.next(); };
$('#prev').onclick = () => { if (!txtNav(-1)) view?.prev(); };
$('#tocbtn').onclick = () => { const t = $('#toc'); t.style.display = t.style.display === 'block' ? 'none' : 'block'; };
document.addEventListener('keydown', e => {
  if ($('#reader').style.display !== 'flex') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { if (!txtNav(1)) view?.next(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (!txtNav(-1)) view?.prev(); }
  if (e.key === 'Escape') $('#toc').style.display = 'none';
});
// 外层（页边距/非 iframe 区域）滚轮翻页
document.addEventListener('wheel', onNavWheel, { passive: false });

loadShelf();
</script>
</body>
</html>
